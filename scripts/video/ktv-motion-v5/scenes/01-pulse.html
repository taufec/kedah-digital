<!doctype html><html lang="ms"><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css"><script src="../motion.js"></script><style>:root{--bg:#050806;--fg:#EEF2EA;--accent:#B9F05D}.stage{overflow:hidden}.grid{position:absolute;inset:-10%;background-image:linear-gradient(rgba(238,242,234,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(238,242,234,.035) 1px,transparent 1px);background-size:72px 72px;mask-image:radial-gradient(circle at 50% 50%,#000 18%,transparent 72%)}.pulse{position:absolute;width:18px;height:18px;border-radius:50%;background:#B9F05D;box-shadow:0 0 32px rgba(185,240,93,.9),0 0 90px rgba(185,240,93,.3)}.p1{left:18%;top:34%}.p2{right:22%;top:26%;background:#82D8CB;box-shadow:0 0 32px rgba(130,216,203,.85)}.p3{left:63%;bottom:18%;background:#E3BB55;box-shadow:0 0 32px rgba(227,187,85,.85)}.copy{position:absolute;left:6vw;bottom:8vh;font-size:126px;font-weight:840;line-height:.92;letter-spacing:-.045em}.copy span{display:block}.copy .b{color:#B9F05D}</style></head><body style="--scene-dur:2.7s"><main class="stage"><div class="grid"></div><div class="pulse p1 m" style="--in:pop;--t:.1s"></div><div class="pulse p2 m" style="--in:pop;--t:.35s"></div><div class="pulse p3 m" style="--in:pop;--t:.6s"></div><div class="copy"><span class="m" style="--in:rise;--t:.18s">BAKAT ADA.</span><span class="b m" style="--in:rise;--t:.65s">PELUANG ADA.</span></div></main></body></html>
