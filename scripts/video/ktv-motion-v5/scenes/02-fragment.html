<!doctype html><html lang="ms"><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css"><script src="../motion.js"></script><style>:root{--bg:#050806;--fg:#EEF2EA;--accent:#82D8CB}.stage{overflow:hidden}.field{position:absolute;inset:6vh 4vw;border:1px solid rgba(130,216,203,.12);border-radius:34px;background:radial-gradient(circle at 50% 48%,rgba(130,216,203,.06),rgba(5,8,6,0) 58%)}.scan{position:absolute;left:-10%;right:-10%;height:3px;background:linear-gradient(90deg,transparent,#82D8CB,transparent);box-shadow:0 0 28px rgba(130,216,203,.5)}.s1{top:27%}.s2{top:51%}.s3{top:72%}.word{position:absolute;font-size:48px;font-weight:700;letter-spacing:.02em;color:#A4AFA6}.w1{left:9%;top:22%}.w2{left:40%;top:15%}.w3{right:8%;top:30%}.w4{left:18%;bottom:19%}.w5{right:24%;bottom:12%}.hero{position:absolute;left:6vw;top:45%;max-width:14ch;font-size:108px;line-height:.9;font-weight:850;letter-spacing:-.045em}.hero em{display:block;color:#E3BB55;font-style:normal}.noise{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 16px,rgba(255,255,255,.022) 16px 17px);mix-blend-mode:screen;pointer-events:none}</style></head><body style="--scene-dur:3.3s"><main class="stage"><div class="field"></div><div class="scan s1 m" style="--in:left;--t:-.18s"></div><div class="scan s2 m" style="--in:right;--t:-.08s"></div><div class="scan s3 m" style="--in:left;--t:.18s"></div><div class="word w1 m" style="--in:fade;--t:.12s">FOUNDER</div><div class="word w2 m" style="--in:fade;--t:.28s">PELAJAR</div><div class="word w3 m" style="--in:fade;--t:.44s">INDUSTRI</div><div class="word w4 m" style="--in:fade;--t:.60s">AGENSI</div><div class="word w5 m" style="--in:fade;--t:.76s">KOMUNITI</div><div class="hero"><span class="m" style="--in:rise;--t:.58s">TAPI SIGNAL</span><em class="m" style="--in:rise;--t:.92s">MASIH BERSELERAK.</em></div><div class="noise" data-overlap-ok></div></main></body></html>
