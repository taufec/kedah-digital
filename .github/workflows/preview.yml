name: KTV Preview

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  build-preview:
    name: Build preview artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm run install:ci

      - name: Build and test Sites artifact
        run: npm test

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: ktv-sites-preview-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
